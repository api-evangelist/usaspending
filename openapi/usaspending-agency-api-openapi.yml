openapi: 3.2.0
info:
  title: USAspending Agency API
  description: The USAspending API provides free, public, unauthenticated access to U.S.
  version: v2
  contact:
    name: USAspending.gov / Bureau of the Fiscal Service
    url: https://www.usaspending.gov
  license:
    name: Open source (CC0 / public domain, U.S. Government work)
    url: https://github.com/fedspendingtransparency/usaspending-api/blob/master/LICENSE.md
servers:
- url: https://api.usaspending.gov/api/v2
  description: Production (no authentication required)
tags:
- name: Agency
  description: Per-agency profile, budget, and award data.
paths:
  /agency/{toptier_code}/:
    parameters:
    - $ref: '#/components/parameters/ToptierCode'
    - $ref: '#/components/parameters/FiscalYear'
    get:
      operationId: getAgencyOverview
      tags:
      - Agency
      summary: Agency overview
      description: Returns basic profile information for the agency for the fiscal year specified.
      responses:
        '200':
          description: Agency overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgencyOverview'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    DEFC:
      type: object
      properties:
        code:
          type: string
          description: Disaster Emergency Fund Code.
        public_law:
          type: string
        title:
          type:
          - string
          - 'null'
        disaster:
          type:
          - string
          - 'null'
        urls:
          type:
          - array
          - 'null'
          items:
            type: string
    AgencyOverview:
      type: object
      properties:
        fiscal_year:
          type: integer
        toptier_code:
          type: string
        name:
          type: string
        abbreviation:
          type:
          - string
          - 'null'
        agency_id:
          type: integer
        mission:
          type:
          - string
          - 'null'
        website:
          type:
          - string
          - 'null'
        congressional_justification_url:
          type:
          - string
          - 'null'
        subtier_agency_count:
          type: integer
        def_codes:
          type: array
          items:
            $ref: '#/components/schemas/DEFC'
        messages:
          type: array
          items:
            type: string
    Error:
      type: object
      properties:
        detail:
          type: string
  responses:
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    ToptierCode:
      name: toptier_code
      in: path
      required: true
      description: The toptier code of an agency (CGAC or FREC), 3-4 numeric characters.
      schema:
        type: string
        example: '020'
    FiscalYear:
      name: fiscal_year
      in: query
      required: false
      description: The desired "as of" fiscal year. Defaults to the current fiscal year.
      schema:
        type: integer
        example: 2026
